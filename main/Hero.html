<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನನ್ನ ಅಧ್ಯಯನ ಸಾಮಗ್ರಿಗಳು And Notes </title>
    <!-- ಕನ್ನಡ ಅಕ್ಷರಗಳಿಗಾಗಿ ಗೂಗಲ್ ಫಾಂಟ್ -->
    <link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Anek Kannada', sans-serif;
        }

        body {
            /* ಆಕರ್ಷಕವಾದ ಹಿನ್ನೆಲೆ ಬಣ್ಣ (Animated Background) */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 1s ease-out;
        }

        header h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        /* Glassmorphism Card Style */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(50px);
        }

        .card:hover {
            transform: translateY(-15px) scale(1.03) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.25);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: inline-block;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
        }

        .card:hover .icon {
            transform: rotateY(180deg) scale(1.2);
        }

        .title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 ವಿಷಯಗಳ ಸಂಗ್ರಹ</h1>
        <p>ನಿಮ್ಮ ಎಲ್ಲಾ ನೋಟ್ಸ್ ಮತ್ತು ವೆಬ್ ಪೇಜ್‌ಗಳನ್ನು ಇಲ್ಲಿಂದ ಆಯ್ಕೆಮಾಡಿ</p>
    </header>

    <div class="container" id="cardContainer">
        <!-- ಜಾವಾಸ್ಕ್ರಿಪ್ಟ್ ಮೂಲಕ ಕಾರ್ಡ್‌ಗಳು ಇಲ್ಲಿ ಸೇರ್ಪಡೆಯಾಗುತ್ತವೆ -->
         
    </div>
  
<a href="./kannada/Chapter_kannada.html"></a>
    <script>
        // ನಿಮ್ಮ ವಿಷಯಗಳ ಪಟ್ಟಿ ಮತ್ತು ಲಿಂಕ್‌ಗಳು
        const subjects = [
            { title: 'ಕನ್ನಡ', icon: '📙', link: "./kannada/Chapter_kannada.html"},
            { title: 'ಇಂಗ್ಲೀಷ', icon: '🔠', link: '#' },
            { title: 'ಕಂಪ್ಯೂಟರ್', icon: '💻', link: '#' },
            { title: 'ಭಾರತದ ಸಂವಿದಾನ', icon: '⚖️', link: '#' },
            { title: 'ವೆಬ್‌ ಡೆವಲಪಮೆಂಟ್‌', icon: '🌐', link: './WebDevolepment/Chapter_Web.html' }
        ];

        const container = document.getElementById('cardContainer');

        // ಡೈನಾಮಿಕ್ ಆಗಿ ಅನಿಮೇಷನ್ ಜೊತೆಗೆ ಕಾರ್ಡ್‌ಗಳನ್ನು ಲೋಡ್ ಮಾಡುವುದು
        subjects.forEach((sub, index) => {
            const card = document.createElement('a');
            card.href = sub.link;
            card.className = 'card';
            // ಪ್ರತಿಯೊಂದು ಕಾರ್ಡ್‌ಗೂ ಸ್ವಲ್ಪ ತಡವಾಗಿ (staggered) ಅನಿಮೇಷನ್ ಬರುವಂತೆ ಸೆಟ್ ಮಾಡಲಾಗಿದೆ
            card.style.animation = `fadeInUp 0.6s ease forwards ${index * 0.15}s`;
            
            card.innerHTML = `
                <div class="icon">${sub.icon}</div>
                <div class="title">${sub.title}</div>
            `;
            
            container.appendChild(card);
        });
    </script>
</body>
</html>
